name: Update and Deploy Dashboard

# Data files are built here and published straight to GitHub Pages; they are
# never committed. Each run starts from the previously published files (the
# incremental TM baseline, MapSwipe imagery fallback and OAM cache).

on:
  schedule:
    # Daily at 08:00 UTC (2 hours after the insta-tm ETL at 06:00 UTC)
    - cron: "0 8 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://cgiovando.github.io/hot-imagery-stats

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      freshness: ${{ steps.freshness.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previously published data
        run: |
          for f in projects_summary.json mapswipe_summary.json fair_summary.json oam_platform_cache.json; do
            curl -fsSL --retry 3 -o "docs/$f" "$SITE_URL/$f" \
              && echo "Restored $f" \
              || { echo "::warning::Could not restore $f (starting fresh)"; rm -f "docs/$f"; }
          done

      - name: Fetch MapSwipe data
        continue-on-error: true
        run: python scripts/fetch_mapswipe.py

      - name: Fetch fAIr data
        continue-on-error: true
        run: python scripts/fetch_fair.py

      - name: Generate unified projects_summary.json
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python scripts/generate_summary.py

      # Evaluated here (the data lives in this job), reported after deploy.
      - name: Check data freshness
        id: freshness
        continue-on-error: true
        run: python scripts/check_freshness.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Fails the run (and sends GitHub's failure email) when a source has been
  # down >48h, without holding back the data from sources that still work.
  freshness:
    needs: [build, deploy]
    if: needs.build.outputs.freshness == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Report stale data
        run: |
          echo "::error::A data source has not updated for more than 48 hours. See the 'Check data freshness' step of the build job."
          exit 1
